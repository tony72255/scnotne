<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Quét mã vạch</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#0b0f14; --fg:#eef3f8; --dim:#8fa3b8;
    --accent:#35d07f; --warn:#ffb020; --err:#ff5d5d;
    --pad-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  #stage{position:fixed;inset:0}
  #video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}

  #mask{position:absolute;inset:0;pointer-events:none}
  #roi{
    position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);
    width:86vw;max-width:520px;aspect-ratio:2.6/1;
    border-radius:14px;
    box-shadow:0 0 0 200vmax rgba(4,8,12,.62);
    outline:2px solid rgba(255,255,255,.85);
  }
  #roi::before,#roi::after,
  #roi .c1,#roi .c2{
    content:"";position:absolute;width:26px;height:26px;border:4px solid var(--accent);
  }
  #roi::before{left:-3px;top:-3px;border-right:0;border-bottom:0;border-radius:14px 0 0 0}
  #roi::after{right:-3px;top:-3px;border-left:0;border-bottom:0;border-radius:0 14px 0 0}
  #roi .c1{left:-3px;bottom:-3px;border-right:0;border-top:0;border-radius:0 0 0 14px}
  #roi .c2{right:-3px;bottom:-3px;border-left:0;border-top:0;border-radius:0 0 14px 0}

  #scanline{
    position:absolute;left:8px;right:8px;top:8px;height:2px;border-radius:2px;
    background:linear-gradient(90deg,transparent,var(--accent),transparent);
    animation:sweep 1.6s ease-in-out infinite;
  }
  @keyframes sweep{
    0%,100%{top:8px;opacity:.9} 50%{top:calc(100% - 10px);opacity:.6}
  }
  @media (prefers-reduced-motion: reduce){ #scanline{animation:none;top:50%} }

  #hint{
    position:absolute;left:0;right:0;top:calc(38% + 12vw + 24px);
    text-align:center;color:var(--dim);font-size:15px;line-height:1.5;padding:0 24px;
  }
  #hint b{color:var(--fg);font-weight:600}

  #controls{
    position:absolute;left:0;right:0;bottom:0;
    padding:16px 20px calc(20px + var(--pad-bottom));
    display:flex;flex-direction:column;gap:14px;align-items:center;
  }
  #zoomRow{display:none;width:min(86vw,520px);align-items:center;gap:12px;color:var(--dim);font-size:13px}
  #zoomRow.show{display:flex}
  #zoom{flex:1;accent-color:var(--accent);height:28px}
  #btnRow{display:flex;gap:14px}
  .btn{
    min-width:64px;min-height:64px;border-radius:50%;border:1px solid rgba(255,255,255,.25);
    background:rgba(255,255,255,.10);color:var(--fg);font-size:26px;
    display:flex;align-items:center;justify-content:center;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  }
  .btn:active{background:rgba(255,255,255,.22)}
  .btn.on{background:var(--warn);border-color:var(--warn);color:#1a1400}
  .btn[hidden]{display:none}

  #status{
    position:absolute;left:0;right:0;top:max(14px, env(safe-area-inset-top));
    text-align:center;font-size:14px;color:var(--dim);padding:0 20px;
  }
  #resultCard{
    position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.9);
    background:rgba(10,20,14,.92);border:1px solid var(--accent);border-radius:18px;
    padding:22px 30px;text-align:center;opacity:0;pointer-events:none;
    transition:opacity .15s, transform .15s;
  }
  #resultCard.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  #resultCard .ok{color:var(--accent);font-size:15px;margin-bottom:6px}
  #resultCard .code{font-size:30px;font-weight:700;letter-spacing:2px;
    font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

  #gate{
    position:absolute;inset:0;background:var(--bg);z-index:10;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:18px;padding:32px;text-align:center;
  }
  #gate[hidden]{display:none}
  #gate .icon{font-size:52px}
  #gate h2{font-size:19px;font-weight:600}
  #gate p{color:var(--dim);font-size:15px;line-height:1.6;max-width:340px}
  #gate .action{
    margin-top:6px;background:var(--accent);color:#04120a;border:0;border-radius:12px;
    padding:14px 30px;font-size:16px;font-weight:600;
  }
  #gateErr{
    color:var(--err);font-size:12px;max-width:340px;word-break:break-all;
    font-family:ui-monospace,Menlo,monospace;
  }
  #gateErr:empty{display:none}
</style>
</head>
<body>
<div id="stage">
  <video id="video" playsinline muted autoplay></video>

  <div id="mask">
    <div id="roi">
      <span class="c1"></span><span class="c2"></span>
      <div id="scanline"></div>
    </div>
  </div>

  <div id="status">Đang mở camera…</div>
  <div id="hint">Đưa <b>mã vạch</b> vào trong khung<br>Giữ máy cách mã 10–15&nbsp;cm</div>

  <div id="resultCard">
    <div class="ok">✓ Đã quét được</div>
    <div class="code" id="resultCode"></div>
  </div>

  <div id="controls">
    <div id="zoomRow">
      <span>1×</span><input id="zoom" type="range" min="1" max="3" step="0.1" value="1"><span id="zoomMax">3×</span>
    </div>
    <div id="btnRow">
      <button class="btn" id="btnTorch" hidden aria-label="Đèn flash">🔦</button>
    </div>
  </div>

  <div id="gate">
    <div class="icon">📷</div>
    <h2 id="gateTitle">Đang mở camera…</h2>
    <p id="gateMsg">Nếu Telegram hỏi quyền camera, hãy bấm Cho phép.</p>
    <div id="gateErr"></div>
    <button class="action" id="gateBtn" hidden>Bật camera</button>
  </div>
</div>

<script>
"use strict";

var tg = window.Telegram && window.Telegram.WebApp;
try { tg && tg.ready(); tg && tg.expand(); tg && tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch(e){}

var video      = document.getElementById("video");
var roi        = document.getElementById("roi");
var statusEl   = document.getElementById("status");
var gate       = document.getElementById("gate");
var gateTitle  = document.getElementById("gateTitle");
var gateMsg    = document.getElementById("gateMsg");
var gateErr    = document.getElementById("gateErr");
var gateBtn    = document.getElementById("gateBtn");
var btnTorch   = document.getElementById("btnTorch");
var zoomRow    = document.getElementById("zoomRow");
var zoomInput  = document.getElementById("zoom");
var zoomMaxEl  = document.getElementById("zoomMax");
var resultCard = document.getElementById("resultCard");
var resultCode = document.getElementById("resultCode");

// Mọi lỗi bất ngờ đều hiện lên màn hình thay vì chết im lặng
window.onerror = function(msg, src, line){
  showGate("Có lỗi xảy ra", "Hãy bấm thử lại. Nếu vẫn lỗi, quay lại chat và <b>gửi ảnh chụp mã vạch</b>.",
           String(msg) + " @" + line, "Thử lại", function(){ location.reload(); });
};

var READ_OPTS = {
  formats: ["EAN-13","EAN-8","UPC-A","UPC-E","Code128","ITF"],
  tryHarder: true,
  tryRotate: true,
  maxNumberOfSymbols: 1
};
var CHECKSUMMED = { "EAN-13":1, "EAN-8":1, "UPC-A":1, "UPC-E":1 };
var DECODE_INTERVAL_MS = 110;

var DECODER_CDNS = [
  "https://cdn.jsdelivr.net/npm/zxing-wasm@2/dist/reader/index.js",
  "https://fastly.jsdelivr.net/npm/zxing-wasm@2/dist/reader/index.js",
  "https://unpkg.com/zxing-wasm@2/dist/reader/index.js"
];

var track = null, stream = null;
var readBarcodesFn = null;        // gán khi bộ giải mã tải xong
var decoderFailed = false;
var done = false, busy = false, lastTick = 0;
var lastText = "", lastCount = 0;

var cropCanvas = document.createElement("canvas");
var cropCtx = cropCanvas.getContext("2d", { willReadFrequently: true });

function setStatus(t){ statusEl.textContent = t; }

function showGate(title, msgHtml, errText, btnLabel, btnAction){
  gate.hidden = false;
  gateTitle.textContent = title;
  gateMsg.innerHTML = msgHtml;
  gateErr.textContent = errText || "";
  if (btnLabel){
    gateBtn.hidden = false;
    gateBtn.textContent = btnLabel;
    gateBtn.onclick = btnAction;
  } else {
    gateBtn.hidden = true;
  }
}

function withTimeout(promise, ms, label){
  return new Promise(function(resolve, reject){
    var t = setTimeout(function(){ reject(new Error(label + " quá " + (ms/1000) + "s không phản hồi")); }, ms);
    promise.then(function(v){ clearTimeout(t); resolve(v); },
                 function(e){ clearTimeout(t); reject(e); });
  });
}

// ==================== 1. TẢI BỘ GIẢI MÃ (chạy nền, thử lần lượt 3 CDN) ====================
function loadDecoder(i){
  i = i || 0;
  if (i >= DECODER_CDNS.length){
    decoderFailed = true;
    if (!gate.hidden) return;
    setStatus("⚠️ Không tải được bộ giải mã — kiểm tra mạng rồi bấm thử lại");
    showGate("Không tải được bộ giải mã",
      "Mạng hiện tại chặn máy chủ thư viện.<br>Hãy thử lại, hoặc quay lại chat và <b>gửi ảnh chụp mã vạch</b> — bot vẫn đọc được.",
      "decoder: all CDNs failed", "Thử lại", function(){ location.reload(); });
    return;
  }
  withTimeout(import(DECODER_CDNS[i]), 12000, "Tải bộ giải mã")
    .then(function(mod){
      readBarcodesFn = mod.readBarcodes;
      // Làm nóng WASM
      try { readBarcodesFn(new ImageData(2,2), READ_OPTS).catch(function(){}); } catch(e){}
      if (gate.hidden) setStatus("Đang quét…");
    })
    .catch(function(){ loadDecoder(i + 1); });
}
loadDecoder(0);

// ==================== 2. CAMERA (độc lập với bộ giải mã) ====================
function startCamera(){
  gateBtn.hidden = true;
  gateTitle.textContent = "Đang mở camera…";
  gateErr.textContent = "";

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    showGate("Thiết bị không hỗ trợ camera trong Telegram",
      "Phiên bản Telegram/iOS này không cho mini app dùng camera.<br>Hãy cập nhật Telegram, hoặc quay lại chat và <b>gửi ảnh chụp mã vạch</b>.",
      "getUserMedia unavailable", null, null);
    return;
  }

  withTimeout(
    navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: { ideal: "environment" },
        width:  { ideal: 1920 },
        height: { ideal: 1080 }
      }
    }),
    10000, "Mở camera"
  ).then(function(s){
    stream = s;
    video.srcObject = s;
    track = s.getVideoTracks()[0];
    var p = video.play(); if (p && p.catch) p.catch(function(){});
    try { track.applyConstraints({ advanced: [{ focusMode: "continuous" }] }).catch(function(){}); } catch(e){}
    setupTorchAndZoom();
    gate.hidden = true;
    setStatus(readBarcodesFn ? "Đang quét…" : "Đang tải bộ giải mã…");
    scheduleNextFrame();
  }).catch(function(err){
    var name = err && err.name ? err.name : "";
    var denied = (name === "NotAllowedError" || name === "SecurityError");
    showGate(
      denied ? "Chưa được cấp quyền camera" : "Không mở được camera",
      denied
        ? "Vào <b>Cài đặt iPhone → Telegram → bật Camera</b>, sau đó đóng và mở lại cửa sổ quét.<br><br>Cách khác: quay lại chat và <b>gửi ảnh chụp mã vạch</b>, bot vẫn đọc được."
        : "Hãy bấm nút bên dưới để thử lại.<br>Nếu vẫn không được: quay lại chat và <b>gửi ảnh chụp mã vạch</b>.",
      name + (err && err.message ? ": " + err.message : ""),
      "Bật camera", startCamera
    );
  });
}

function setupTorchAndZoom(){
  var caps = {};
  try { caps = track.getCapabilities ? track.getCapabilities() : {}; } catch(e){}

  if (caps.torch){
    btnTorch.hidden = false;
    var on = false;
    btnTorch.onclick = function(){
      on = !on;
      try {
        track.applyConstraints({ advanced: [{ torch: on }] })
             .catch(function(){ on = false; btnTorch.classList.remove("on"); });
      } catch(e){ on = false; }
      btnTorch.classList.toggle("on", on);
    };
  }

  if (caps.zoom && caps.zoom.max > caps.zoom.min){
    var max = Math.min(caps.zoom.max, 5);
    zoomInput.min = caps.zoom.min;
    zoomInput.max = max;
    zoomInput.step = (max - caps.zoom.min) / 30;
    zoomInput.value = caps.zoom.min;
    zoomMaxEl.textContent = Math.round(max) + "×";
    zoomRow.classList.add("show");
    zoomInput.oninput = function(){
      try { track.applyConstraints({ advanced: [{ zoom: Number(zoomInput.value) }] }).catch(function(){}); } catch(e){}
    };
  }
}

// ==================== 3. ÁNH XẠ KHUNG NGẮM → TOẠ ĐỘ VIDEO GỐC ====================
function roiToSourceRect(){
  var vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh) return null;
  var ew = video.clientWidth, eh = video.clientHeight;

  var scale = Math.max(ew / vw, eh / vh);      // object-fit: cover
  var offX = (vw * scale - ew) / 2, offY = (vh * scale - eh) / 2;

  var r = roi.getBoundingClientRect();
  var padX = r.width * 0.12, padY = r.height * 0.35;
  var sx = (r.left - padX + offX) / scale;
  var sy = (r.top  - padY + offY) / scale;
  var sw = (r.width  + padX * 2) / scale;
  var sh = (r.height + padY * 2) / scale;

  sx = Math.max(0, sx); sy = Math.max(0, sy);
  sw = Math.min(sw, vw - sx); sh = Math.min(sh, vh - sy);
  return { sx: sx, sy: sy, sw: sw, sh: sh };
}

// ==================== 4. VÒNG LẶP QUÉT ====================
function scheduleNextFrame(){
  if (done) return;
  if (video.requestVideoFrameCallback){
    video.requestVideoFrameCallback(onFrame);
  } else {
    requestAnimationFrame(function(){ onFrame(performance.now()); });
  }
}

function onFrame(now){
  if (done) return;
  if (busy || !readBarcodesFn || (now - lastTick) < DECODE_INTERVAL_MS){
    scheduleNextFrame();
    return;
  }
  lastTick = now;
  busy = true;

  var rect = roiToSourceRect();
  if (!rect || rect.sw < 40 || rect.sh < 20){
    busy = false; scheduleNextFrame(); return;
  }

  try{
    cropCanvas.width  = Math.round(rect.sw);
    cropCanvas.height = Math.round(rect.sh);
    cropCtx.drawImage(video, rect.sx, rect.sy, rect.sw, rect.sh, 0, 0, cropCanvas.width, cropCanvas.height);
    var imageData = cropCtx.getImageData(0, 0, cropCanvas.width, cropCanvas.height);

    readBarcodesFn(imageData, READ_OPTS).then(function(results){
      if (results && results.length) handleResult(results[0]);
      busy = false; scheduleNextFrame();
    }).catch(function(){
      busy = false; scheduleNextFrame();
    });
  }catch(e){
    busy = false; scheduleNextFrame();
  }
}

function validate(text){
  var s = (text || "").trim();
  if (!/^\d+$/.test(s)) return null;
  return (s.length === 8 || s.length === 12 || s.length === 13 || s.length === 14) ? s : null;
}

function handleResult(res){
  var code = validate(res.text);
  if (!code) return;

  if (!CHECKSUMMED[res.format]){
    if (code === lastText) lastCount++;
    else { lastText = code; lastCount = 1; }
    if (lastCount < 2) return;
  }
  finish(code);
}

function finish(code){
  if (done) return;
  done = true;

  try { video.pause(); } catch(e){}
  try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("success"); } catch(e){}
  beep();

  resultCode.textContent = code;
  resultCard.classList.add("show");
  setStatus("Đang gửi về bot…");

  setTimeout(function(){
    try { tg && tg.sendData && tg.sendData(code); } catch(e){}
    stopCamera();
  }, 450);
}

function beep(){
  try{
    var Ctx = window.AudioContext || window.webkitAudioContext;
    var ctx = new Ctx();
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "sine"; o.frequency.value = 1250;
    g.gain.setValueAtTime(0.12, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.14);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + 0.15);
  }catch(e){}
}

function stopCamera(){
  try { if (stream) stream.getTracks().forEach(function(t){ t.stop(); }); } catch(e){}
}
window.addEventListener("pagehide", stopCamera);

startCamera();
</script>
</body>
</html>
