<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quét mã vạch</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            color: #fff;
            font-family: -apple-system, system-ui, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #status {
            padding: 14px 12px;
            text-align: center;
            background: #111;
            font-size: 15px;
            font-weight: 500;
            z-index: 20;
        }
        #reader, #video {
            flex: 1;
            width: 100%;
            object-fit: cover;
        }
        #reader { display: none; }
        .tip {
            padding: 10px;
            text-align: center;
            font-size: 13px;
            color: #aaa;
            background: #111;
        }
        .overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 72vw;
            height: 72vw;
            max-width: 320px;
            max-height: 320px;
            border: 2px solid #00ff88;
            border-radius: 12px;
            box-shadow: 0 0 0 9999px rgba(0,0,0,0.4);
            pointer-events: none;
            display: none;
        }
    </style>
</head>
<body>
    <div id="status">Đưa mã vạch vào khung hình</div>
    <video id="video" playsinline muted></video>
    <div id="reader"></div>
    <div class="overlay" id="overlay"></div>
    <div class="tip">Giữ ổn định • Ánh sáng tốt</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        tg.setHeaderColor("#111111");
        tg.setBackgroundColor("#000000");

        const statusEl = document.getElementById("status");
        const video = document.getElementById("video");
        const overlay = document.getElementById("overlay");
        let isScanning = true;
        let stream = null;
        let animId = null;

        // ==================== ANDROID: Dùng BarcodeDetector gốc ====================
        async function startNativeAndroid() {
            if (!("BarcodeDetector" in window)) return false;

            try {
                const detector = new BarcodeDetector({
                    formats: ["ean_13", "ean_8", "code_128", "code_39", "upc_a", "upc_e"]
                });

                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: { ideal: "environment" },
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    },
                    audio: false
                });

                video.srcObject = stream;
                await video.play();
                overlay.style.display = "block";

                const loop = async () => {
                    if (!isScanning) return;
                    try {
                        const barcodes = await detector.detect(video);
                        if (barcodes.length > 0) {
                            const code = barcodes[0].rawValue.replace(/[^\d]/g, "");
                            if (code.length >= 8 && code.length <= 14) {
                                success(code);
                                return;
                            }
                        }
                    } catch (e) {}
                    animId = requestAnimationFrame(loop);
                };
                loop();
                return true;
            } catch (err) {
                console.warn("Native failed:", err);
                return false;
            }
        }

        // ==================== IPHONE: Dùng html5-qrcode tối ưu ====================
        async function startHtml5iOS() {
            video.style.display = "none";
            document.getElementById("reader").style.display = "block";
            overlay.style.display = "none";

            const html5QrCode = new Html5Qrcode("reader", {
                experimentalFeatures: { useBarCodeDetectorIfSupported: true }
            });

            const config = {
                fps: 18,
                qrbox: function(w, h) {
                    const minEdge = Math.min(w, h);
                    const size = Math.floor(minEdge * 0.75);
                    return { width: size, height: size };
                },
                aspectRatio: 1.0,
                disableFlip: false,
                videoConstraints: {
                    facingMode: "environment",
                    width: { ideal: 1280, min: 720 },
                    height: { ideal: 720, min: 480 }
                },
                formatsToSupport: [
                    Html5QrcodeSupportedFormats.EAN_13,
                    Html5QrcodeSupportedFormats.EAN_8,
                    Html5QrcodeSupportedFormats.CODE_128,
                    Html5QrcodeSupportedFormats.CODE_39,
                    Html5QrcodeSupportedFormats.UPC_A,
                    Html5QrcodeSupportedFormats.UPC_E
                ]
            };

            await html5QrCode.start(
                { facingMode: "environment" },
                config,
                (decodedText) => {
                    const code = decodedText.replace(/[^\d]/g, "");
                    if (code.length >= 8 && code.length <= 14) {
                        html5QrCode.stop();
                        success(code);
                    }
                },
                () => {}
            );
        }

        function success(code) {
            if (!isScanning) return;
            isScanning = false;
            statusEl.innerText = "✅ " + code;

            if (navigator.vibrate) navigator.vibrate([50, 30, 50]);

            if (stream) stream.getTracks().forEach(t => t.stop());
            if (animId) cancelAnimationFrame(animId);

            setTimeout(() => tg.sendData(code), 250);
        }

        // ==================== KHỞI ĐỘNG ====================
        (async () => {
            // Ưu tiên Android native
            const isAndroid = /android/i.test(navigator.userAgent);
            let usedNative = false;

            if (isAndroid) {
                usedNative = await startNativeAndroid();
            }

            if (!usedNative) {
                // iPhone hoặc Android fallback
                await startHtml5iOS();
            }
        })();
    </script>
</body>
</html>
